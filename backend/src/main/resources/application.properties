spring.application.name=hospital-management
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-demo-secret-key-to-a-long-random-string-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
